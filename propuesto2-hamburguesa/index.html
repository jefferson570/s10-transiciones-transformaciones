<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propuesto 2 - Ícono hamburguesa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Ícono hamburguesa animado</h1>
  <p>Haz clic en el ícono para convertirlo en una X.</p>

  <input type="checkbox" id="hamburguesa" class="toggle">
  <label for="hamburguesa" class="icono" aria-label="Abrir menú">
    <span class="linea superior"></span>
    <span class="linea central"></span>
    <span class="linea inferior"></span>
  </label>
</body>
</html>
