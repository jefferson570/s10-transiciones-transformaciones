<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propuesto 1 - Menú lateral</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- El checkbox guarda si el menú está abierto o cerrado -->
  <input type="checkbox" id="toggle-menu" class="toggle">
  <label for="toggle-menu" class="btn-menu">☰ Menú</label>

  <aside class="sidebar">
    <h2>CSS Avanzado</h2>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Flexbox</a>
      <a href="#">Grid</a>
      <a href="#">Animaciones</a>
      <a href="#">Transiciones</a>
      <a href="#">Contacto</a>
    </nav>
  </aside>

  <!-- Fondo oscuro: al hacer clic también cierra el menú -->
  <label for="toggle-menu" class="overlay"></label>

  <main class="contenido">
    <h1>Menú lateral deslizable</h1>
    <p>Pulsa el botón <strong>Menú</strong> para abrir la barra lateral.</p>
  </main>
</body>
</html>
