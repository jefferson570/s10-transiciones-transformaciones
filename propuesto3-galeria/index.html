<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propuesto 3 - Galería con zoom</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Lugares del Perú</h1>

  <section class="galeria">
    <figure class="item">
      <img src="img/foto1.svg" alt="Montañas al amanecer">
      <figcaption>Cusco<br><small>Montañas al amanecer</small></figcaption>
    </figure>
    <figure class="item">
      <img src="img/foto2.svg" alt="Playa al atardecer">
      <figcaption>Máncora<br><small>Playa al atardecer</small></figcaption>
    </figure>
    <figure class="item">
      <img src="img/foto3.svg" alt="Selva">
      <figcaption>Iquitos<br><small>La selva amazónica</small></figcaption>
    </figure>
    <figure class="item">
      <img src="img/foto4.svg" alt="Desierto">
      <figcaption>Huacachina<br><small>Dunas del desierto</small></figcaption>
    </figure>
    <figure class="item">
      <img src="img/foto5.svg" alt="Lago">
      <figcaption>Puno<br><small>Lago Titicaca</small></figcaption>
    </figure>
    <figure class="item">
      <img src="img/foto6.svg" alt="Ciudad de noche">
      <figcaption>Lima<br><small>La ciudad de noche</small></figcaption>
    </figure>
  </section>
</body>
</html>
